<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我们的小时光 · 家庭回忆博客</title>
<style>
/* ============ 基础变量 ============ */
:root{
  --bg:#faf7f2;
  --card:#fffdf9;
  --ink:#3a3330;
  --ink-soft:#8a7f78;
  --accent:#b5654a;
  --accent-deep:#9d5238;
  --accent-soft:#f0ded5;
  --line:#ece4db;
  --radius:18px;
  --shadow:0 10px 34px rgba(96,72,58,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.75;
  -webkit-font-smoothing:antialiased;
  padding-bottom:86px;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
section[id]{scroll-margin-top:74px}
::selection{background:var(--accent-soft);color:var(--accent-deep)}

/* ============ 导航 ============ */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(250,247,242,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1180px;margin:0 auto;padding:13px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.brand{
  font-family:"Noto Serif SC","Songti SC",serif;
  font-size:19px;font-weight:700;letter-spacing:1px;white-space:nowrap;
}
.brand span{color:var(--accent)}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  padding:6px 13px;border-radius:999px;text-decoration:none;
  color:var(--ink-soft);font-size:14px;white-space:nowrap;transition:.22s;
}
.nav-links a:hover{background:var(--accent-soft);color:var(--accent-deep)}

/* ============ Hero ============ */
.hero{
  position:relative;min-height:74vh;display:grid;place-items:center;
  text-align:center;padding:90px 24px 100px;overflow:hidden;
  background:
    radial-gradient(circle at 18% 22%, #f5e3d8 0%, transparent 52%),
    radial-gradient(circle at 82% 26%, #e7ede4 0%, transparent 48%),
    radial-gradient(circle at 50% 96%, #f8ecdb 0%, transparent 58%),
    var(--bg);
}
.hero-inner{position:relative;z-index:2;max-width:720px}
.hero-kicker{
  font-size:12.5px;letter-spacing:.42em;color:var(--accent);
  margin-bottom:20px;text-indent:.42em;
}
.hero h1{
  font-family:"Noto Serif SC","Songti SC",serif;
  font-size:clamp(38px,7.5vw,70px);
  letter-spacing:.12em;line-height:1.16;font-weight:700;
  text-indent:.12em;
}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-desc{
  margin-top:22px;color:var(--ink-soft);font-size:15.5px;line-height:2;
}
.hero-actions{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-block;padding:12px 30px;border-radius:999px;
  text-decoration:none;font-size:15px;transition:.26s;border:1px solid transparent;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(181,101,74,.26)}
.btn-primary:hover{background:var(--accent-deep);transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);color:var(--ink-soft);background:rgba(255,255,255,.6)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ============ 通用区块 ============ */
.section{max-width:1180px;margin:0 auto;padding:76px 24px}
.section-head{text-align:center;margin-bottom:42px}
.section-head h2{
  font-family:"Noto Serif SC","Songti SC",serif;
  font-size:clamp(24px,3.6vw,32px);letter-spacing:.14em;font-weight:700;
}
.section-head h2::after{
  content:"";display:block;width:34px;height:2px;border-radius:2px;
  background:var(--accent);margin:14px auto 0;opacity:.7;
}
.section-head p{color:var(--ink-soft);font-size:14.5px;margin-top:14px}

/* ============ 相册 ============ */
.filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:30px}
.chip{
  padding:7px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:14px;color:var(--ink-soft);transition:.22s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(181,101,74,.22)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.photo{
  position:relative;border-radius:15px;overflow:hidden;cursor:zoom-in;
  background:#eee6dc;aspect-ratio:4/3;
  box-shadow:0 4px 16px rgba(96,72,58,.07);
  transition:box-shadow .35s;
}
.photo:hover{box-shadow:0 16px 36px rgba(96,72,58,.2)}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.photo:hover img{transform:scale(1.06)}
.photo-cap{
  position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;
  background:linear-gradient(transparent,rgba(30,20,15,.62));
  color:#fff;font-size:13px;letter-spacing:.5px;
  opacity:0;transform:translateY(8px);transition:.3s;
}
.photo:hover .photo-cap{opacity:1;transform:none}
@media (hover:none){
  .photo-cap{opacity:1;transform:none;padding-top:22px}
}

/* ============ 音乐 ============ */
.song-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.song{
  display:flex;align-items:center;gap:14px;padding:11px 15px;
  border-radius:14px;cursor:pointer;transition:.22s;border:1px solid transparent;
}
.song:hover{background:var(--card);border-color:var(--line)}
.song.playing{background:var(--card);border-color:var(--accent-soft);box-shadow:0 8px 22px rgba(181,101,74,.1)}
.song-no{width:22px;text-align:center;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.song.playing .song-no{color:var(--accent)}
.song-cover{
  width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#f3e2d8,#e4eae1);color:var(--accent);
  font-family:"Noto Serif SC",serif;font-size:17px;
}
.song-meta{flex:1;min-width:0}
.song-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12.5px;color:var(--ink-soft)}
.song-bars{display:none;align-items:flex-end;gap:2.5px;height:14px}
.song.playing .song-bars{display:flex}
.song-bars i{display:block;width:3px;background:var(--accent);border-radius:2px;animation:bounce .9s infinite ease-in-out}
.song-bars i:nth-child(2){animation-delay:.15s}
.song-bars i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{height:4px}50%{height:14px}}

/* ============ 文章 ============ */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.post{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 26px 22px;cursor:pointer;transition:.28s;
  display:flex;flex-direction:column;
}
.post:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--accent-soft)}
.post-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.tag{background:var(--accent-soft);color:var(--accent-deep);padding:2px 11px;border-radius:999px;font-size:12px}
.post h3{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;letter-spacing:.5px;line-height:1.5;margin-bottom:10px}
.post p{font-size:14px;color:var(--ink-soft);flex:1}
.more{margin-top:16px;font-size:13.5px;color:var(--accent)}

/* ============ 时间轴 ============ */
.timeline{position:relative;max-width:700px;margin:0 auto;padding-left:30px}
.timeline::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:34px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:-30px;top:9px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px var(--bg);
}
.tl-date{font-size:12.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:5px}
.tl-item h3{font-family:"Noto Serif SC","Songti SC",serif;font-size:17.5px;letter-spacing:.5px;margin-bottom:6px}
.tl-item p{font-size:14px;color:var(--ink-soft)}

/* ============ 页脚 ============ */
.footer{
  text-align:center;padding:60px 24px 46px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:13.5px;
}
.footer .copy{margin-top:8px;font-size:12.5px;opacity:.75}

/* ============ 底部播放器 ============ */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,253,249,.93);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 24px rgba(96,72,58,.06);
}
.player-inner{
  max-width:1180px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:13px;
}
.p-cover{
  width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#f3e2d8,#e4eae1);color:var(--accent);
  font-family:"Noto Serif SC",serif;font-size:17px;
}
.p-meta{min-width:0;width:150px;flex:none}
.p-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-artist{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:transparent;
  display:grid;place-items:center;color:var(--ink);transition:.2s;flex:none;
}
.p-btn:hover{background:var(--accent-soft);color:var(--accent-deep)}
.p-btn svg{width:20px;height:20px;fill:currentColor}
.p-play{width:44px;height:44px;background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(181,101,74,.3)}
.p-play:hover{background:var(--accent-deep);color:#fff}
.p-play svg{width:22px;height:22px}
.p-bar{
  flex:1;height:6px;border-radius:99px;background:#efe7de;cursor:pointer;position:relative;min-width:60px;
}
.p-bar:hover{height:8px}
.p-bar-fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .15s linear}
.p-time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.p-vol{width:80px;accent-color:var(--accent);flex:none}

/* ============ 灯箱 ============ */
.lightbox{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(26,21,19,.95);padding:24px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.lightbox.open{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lb-figure{max-width:min(1020px,94vw);text-align:center}
.lb-img{
  max-height:72vh;max-width:100%;margin:0 auto;border-radius:12px;
  object-fit:contain;background:#1c1816;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}
.lb-cap{margin-top:18px;color:#f2ebe5}
.lb-cap h4{font-family:"Noto Serif SC",serif;font-size:17px;letter-spacing:1px;font-weight:600}
.lb-cap p{font-size:13px;color:#b6a89f;margin-top:5px}
.lb-btn{
  position:absolute;width:46px;height:46px;border-radius:50%;border:none;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  font-size:26px;line-height:1;transition:.2s;
}
.lb-btn:hover{background:rgba(255,255,255,.26)}
.lb-close{top:20px;right:20px;font-size:24px}
.lb-prev{left:20px;top:50%;transform:translateY(-50%)}
.lb-next{right:20px;top:50%;transform:translateY(-50%)}

/* ============ 文章弹窗 ============ */
.modal{
  position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;
  background:rgba(30,24,21,.62);padding:24px;backdrop-filter:blur(4px);
}
.modal.open{display:flex;animation:fadeIn .22s ease}
.modal-box{
  background:var(--card);width:100%;max-width:720px;max-height:86vh;overflow-y:auto;
  border-radius:20px;padding:40px 40px 44px;box-shadow:0 30px 80px rgba(0,0,0,.3);
  animation:pop .28s ease;
}
.modal-box .post-meta{margin-bottom:16px}
.modal-box h2{
  font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;
  letter-spacing:1px;line-height:1.5;margin-bottom:22px;
}
.modal-body p{font-size:15px;color:#4c433e;margin-bottom:16px;line-height:2}
.modal-close{
  margin-top:26px;padding:10px 26px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink-soft);font-size:14px;transition:.2s;
}
.modal-close:hover{border-color:var(--accent);color:var(--accent)}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translate(-50%,16px);
  background:rgba(45,36,32,.94);color:#fff;font-size:13.5px;
  padding:11px 22px;border-radius:999px;z-index:200;
  opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 滚动淡入 ============ */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media (max-width:820px){
  .p-vol,.p-time{display:none}
  .p-meta{width:auto;flex:1}
}
@media (max-width:640px){
  body{padding-bottom:78px}
  .nav-inner{padding:11px 16px}
  .brand{font-size:17px}
  .section{padding:58px 16px}
  .hero{min-height:66vh;padding:70px 20px 80px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .photo-cap{font-size:12px;padding:22px 10px 9px}
  .player-inner{gap:9px;padding:8px 14px}
  .p-cover{width:38px;height:38px;font-size:15px}
  .p-btn{width:34px;height:34px}
  .p-play{width:40px;height:40px}
  .modal-box{padding:28px 22px 32px}
  .modal-box h2{font-size:21px}
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:40px;height:40px}
  .timeline{padding-left:26px}
  .tl-item::before{left:-26px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">

    <nav class="nav-links">

</header>

<main>

  <section class="section" id="gallery">

  <section class="section" id="music">

</main>

<footer class="footer">
  <p>用照片和文字，留住时间。</p>
  <p class="copy">© 2026 我们的小时光 · 家人的回忆盒子</p>
</footer>

<div class="player">
  <div class="player-inner">
    <div class="p-cover" id="pCover">♪</div>
    <div class="p-meta">
      <div class="p-title" id="pTitle">点击右侧播放</div>

    </div>
    <button class="p-btn" id="pPrev" title="上一首">

  <button class="lb-btn lb-close" id="lbClose">×</button>

</div>

<div class="modal" id="postModal">
  <div class="modal-box">
    <div class="post-meta" id="mMeta"></div>
    <h2 id="mTitle"></h2>
    <div class="modal-body" id="mBody"></div>
    <button class="modal-close" id="mClose">关闭</button>
  </div>
</div>

<script>
const PHOTOS = [

];

const SONGS = [
  { title:"送别",       artist:"想放给你听", src:"music/2.mp3" },
  { title:"月亮代表我的心", artist:"想放给你听", src:"music/3.mp3" },
  { title:"稻香",       artist:"想放给你听", src:"music/4.mp3" }
];

const POSTS = [
  {
    title:"搬家那天，翻出了一整箱老照片",
    date:"2025-03-12", tag:"随笔",
    excerpt:"很多照片都泛黄了，边角卷起来，背面还写着字……",
    content:`<p>搬家那天，在储藏室最里面的角落翻出一个纸箱，箱子已经很旧了，上面用马克笔写着"照片"两个字。</p>
       <p>打开的时候有一股旧纸的味道。里面塞满了大大小小的相片，很多都泛黄了，边角卷起来。有几张背面还写着字，是外婆的笔迹，写着日期，还有一句"今天天气很好"。</p>
       <p>有一张是三十年前的合影，站在老屋门口，那时候房子还很新，院子里那棵石榴树才刚过膝盖。照片上的人，有几个已经见不到了。</p>
       <p>我坐在地板上一张一张地看，看了整整一个下午。搬家公司的人在楼下喊我，我才反应过来。</p>
       <p>后来我把它们全部扫描了一遍，存进了这个网站里。这样就算再搬十次家，也不会丢了。</p>`
  },
  {
    title:"妈妈的红烧肉，我终于学会了",
    date:"2025-01-28", tag:"日常",

const TIMELINE = [
  { date:"2015 · 春", title:"我们搬进了新家", text:"房子不大，但阳台朝南，冬天有太阳。" },
  { date:"2017 · 夏", title:"第一次全家旅行", text:"去了海边，那天下着小雨，但每个人都很开心。" },
  { date:"2019 · 秋", title:"学会了骑车", text:"摔了很多次，膝盖上留了一个疤。" },
  { date:"2021 · 冬", title:"外婆八十大寿", text:"来了很多人，办了两桌酒。" },
  { date:"2023 · 春", title:"小外甥出生了", text:"家里终于有了小孩子的声音。" },
  { date:"2025 · 春节", title:"拍了一张全家福", text:"距离上一次，整整十年。" }
];

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2800);
}
const fmtTime = s => {
  s = Math.floor(s || 0);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
};

/* ---------- 滚动淡入 ---------- */
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  });
}, { threshold:0.1, rootMargin:'0px 0px -40px 0px' });
function observeReveal(){
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
}

/* ==========================================================
   相册
   ========================================================== */
const photoGrid = $('photoGrid');
const filtersEl = $('filters');
let currentPhotos = PHOTOS;
let lbIndex = 0;

function renderFilters(){
  const cats = ['全部', ...new Set(PHOTOS.map(p=>p.cat))];
  filtersEl.innerHTML = cats.map((c,i)=>
    `<button class="chip${i===0?' active':''}" data-cat="${c}">${c}</button>`
  ).join('');
}

function renderPhotos(list){
  currentPhotos = list;
  if(!list.length){
    photoGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#8a7f78;padding:40px 0">这里还没有照片</p>';
    return;
  }
  photoGrid.innerHTML = list.map((p,i)=>`
    <figure class="photo reveal" data-i="${i}">
      <img src="${p.src}" alt="${p.title}" loading="lazy">
      <figcaption class="photo-cap">${p.title}</figcaption>
    </figure>
  `).join('');
  observeReveal();
}

filtersEl.addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  renderPhotos(cat === '全部' ? PHOTOS : PHOTOS.filter(p=>p.cat === cat));
});

photoGrid.addEventListener('click', e=>{
  const fig = e.target.closest('.photo');
  if(!fig) return;
  openLightbox(Number(fig.dataset.i));
});

/* ---------- 灯箱 ---------- */
const lightbox = $('lightbox');
const lbImg = $('lbImg'), lbTitle = $('lbTitle'), lbDesc = $('lbDesc');

function openLightbox(i){
  lbIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function updateLightbox(){
  const p = currentPhotos[lbIndex];
  if(!p) return;
  lbImg.src = p.src;
  lbImg.alt = p.title;
  lbTitle.textContent = p.title;
  lbDesc.textContent = [p.desc, p.date].filter(Boolean).join(' · ');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
function stepLightbox(dir){
  const n = currentPhotos.length;
  if(!n) return;
  lbIndex = (lbIndex + dir + n) % n;
  updateLightbox();
}
$('lbClose').addEventListener('click', closeLightbox);
$('lbPrev').addEventListener('click', ()=>stepLightbox(-1));
$('lbNext').addEventListener('click', ()=>stepLightbox(1));
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', e=>{
  if(lightbox.classList.contains('open')){
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') stepLightbox(-1);
    if(e.key === 'ArrowRight') stepLightbox(1);
  }
  if(e.key === 'Escape' && $('postModal').classList.contains('open')) closePost();
});

/* ==========================================================
   音乐播放器
   ========================================================== */
const audio = new Audio();
audio.volume = 0.8;

const pPlay = $('pPlay'), pTitle = $('pTitle'), pArtist = $('pArtist'),
      pCover = $('pCover'), pBar = $('pBar'), pFill = $('pFill'),
      pTime = $('pTime'), pVol = $('pVol'),
      songListEl = $('songList');

const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

let songIndex = 0;
let loaded = false;
let playing = false;

function renderSongs(){
  songListEl.innerHTML = SONGS.map((s,i)=>`
    <div class="song${i===songIndex?' playing':''}" data-i="${i}">
      <div class="song-no">${i+1}</div>
      <div class="song-cover">${s.title.slice(0,1)}</div>
      <div class="song-meta">
        <div class="song-title">${s.title}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div class="song-bars"><i></i><i></i><i></i></div>
    </div>
  `).join('');
}

function updatePlayerUI(){
  const s = SONGS[songIndex];
  if(!s) return;
  pTitle.textContent = s.title;
  pArtist.textContent = s.artist;
  pCover.textContent = s.title.slice(0,1);
}

function setPlayIcon(isPlaying){
  playing = isPlaying;
  pPlay.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  const row = songListEl.querySelector('.song.playing');
  if(row){
    row.classList.toggle('paused', !isPlaying);
  }
}

function playAudio(){
  audio.play().then(()=>setPlayIcon(true)).catch(()=>{
    setPlayIcon(false);
    toast('播放失败：请确认音频文件或网络链接有效');
  });
}

function loadSong(i, autoplay){
  songIndex = (i + SONGS.length) % SONGS.length;
  loaded = true;
  audio.src = SONGS[songIndex].src;
  updatePlayerUI();
  renderSongs();
  pFill.style.width = '0%';
  pTime.textContent = '0:00 / 0:00';
  if(autoplay) playAudio();
}

function togglePlay(){
  if(!loaded){ loadSong(songIndex, true); return; }
  if(audio.paused) playAudio();
  else audio.pause();
}

pPlay.addEventListener('click', togglePlay);
$('pNext').addEventListener('click', ()=>loadSong(songIndex + 1, true));
$('pPrev').addEventListener('click', ()=>loadSong(songIndex - 1, true));

songListEl.addEventListener('click', e=>{
  const row = e.target.closest('.song');
  if(!row) return;
  const i = Number(row.dataset.i);
  if(i === songIndex && loaded){
    togglePlay();
  }else{
    loadSong(i, true);
  }
});

pBar.addEventListener('click', e=>{
  if(!audio.duration) return;
  const rect = pBar.getBoundingClientRect();
  const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  audio.currentTime = ratio * audio.duration;
});

pVol.addEventListener('input', ()=>{ audio.volume = Number(pVol.value); });

audio.addEventListener('play', ()=>setPlayIcon(true));
audio.addEventListener('pause', ()=>setPlayIcon(false));
audio.addEventListener('timeupdate', ()=>{
  if(!audio.duration) return;
  pFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  pTime.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
});
audio.addEventListener('ended', ()=>loadSong(songIndex + 1, true));
audio.addEventListener('error', ()=>{
  if(playing){
    setPlayIcon(false);
    toast('这首歌暂时放不出来，请检查音频地址');
  }
});

/* ==========================================================
   文章与时光轴渲染函数
   ========================================================== */
const postListEl = $('postList');
const postModal = $('postModal');

function renderPosts(){
  postListEl.innerHTML = POSTS.map((p,i)=>`
    <article class="post reveal" data-i="${i}">
      <div class="post-meta"><span class="tag">${p.tag}</span><time>${p.date}</time></div>
      <h3>${p.title}</h3>
      <p>${p.excerpt}</p>
      <span class="more">读下去 →</span>
    </article>
  `).join('');
  observeReveal();
}

postListEl.addEventListener('click', e=>{
  const card = e.target.closest('.post');
  if(!card) return;
  openPost(Number(card.dataset.i));
});

function openPost(i){
  const p = POSTS[i];
  if(!p) return;
  $('mMeta').innerHTML = `<span class="tag">${p.tag}</span><time>${p.date}</time>`;
  $('mTitle').textContent = p.title;
  $('mBody').innerHTML = p.content;
  postModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  postModal.querySelector('.modal-box').scrollTop = 0;
}
function closePost(){
  postModal.classList.remove('open');
  document.body.style.overflow = '';
}
$('mClose').addEventListener('click', closePost);
postModal.addEventListener('click', e=>{ if(e.target === postModal) closePost(); });

function renderTimeline(){
  $('timelineList').innerHTML = TIMELINE.map(t=>`
    <div class="tl-item reveal">
      <div class="tl-date">${t.date}</div>
      <h3>${t.title}</h3>
      <p>${t.text}</p>
    </div>
  `).join('');
  observeReveal();
}

/* ==========================================================
   初始化：先渲染本地初始数据，再拉取云端数据库合并
   ========================================================== */
function renderAll(){
  renderFilters();
  renderPhotos(PHOTOS);
  renderSongs();
  updatePlayerUI();
  renderPosts();
  renderTimeline();
}

async function syncFromCloud(){
  try {
    const res = await fetch('/api/posts');
    const json = await res.json();
    if (!json.success || !Array.isArray(json.data)) return;

    json.data.slice().reverse().forEach(row => {
      let meta = {};
      try { meta = JSON.parse(row.content || '{}'); } catch(e){}

      if (row.type === 'photo' && row.media_url) {
        PHOTOS.unshift({
          src: row.media_url,
          title: row.title,
          desc: meta.desc || '',
          cat: meta.cat || '日常',
          date: meta.date || ''
        });
      } else if (row.type === 'music' && row.media_url) {
        SONGS.unshift({
          title: row.title,
          artist: meta.artist || '想放给你听',
          src: row.media_url
        });
      } else if (row.type === 'post') {
        POSTS.unshift({
          title: row.title,
          date: meta.date || (row.created_at || '').slice(0,10),
          tag: meta.tag || '随笔',
          excerpt: meta.excerpt || '',
          content: meta.content || `<p>${row.content}</p>`
        });
      } else if (row.type === 'timeline') {
        TIMELINE.unshift({
          date: meta.date || '',
          title: row.title,
          text: meta.text || ''
        });
      }
    });

    renderAll();
  } catch (e) {}
}

renderAll();
syncFromCloud();
</script>
