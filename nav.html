}
body::before{

a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(56,189,248,.3);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1e2a3a;border-radius:9px}

::-webkit-scrollbar-track{background:transparent}

.side-head{padding:20px 20px 16px;border-bottom:1px solid var(--line-soft);flex:none}
.brand{display:flex;align-items:center;gap:12px}

.side-scroll{flex:1;overflow-y:auto;padding:18px 14px 10px}
.side-label{

}

.clock{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--accent)}

.search{

.group{margin-top:38px;animation:fade .45s ease both}

.group-head h2::before{

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}

.card{

  transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s;
  animation:cardIn .4s ease both;overflow:hidden;

.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(300px 120px at 12% 0%, rgba(56,189,248,.1), transparent 70%);
  opacity:0;transition:opacity .25s;
}

  box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(56,189,248,.08),0 0 26px rgba(56,189,248,.1);

.card:hover::after{opacity:1}

.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#0b1119}

.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

  position:absolute;top:14px;right:13px;width:15px;height:15px;
  stroke:var(--ink-dim);fill:none;stroke-width:1.8;
  opacity:0;transform:translate(-3px,3px);transition:.22s;
}
.card:hover .card-arrow{opacity:1;transform:none;stroke:var(--accent)}

/* ============ 空状态 ============ */
.empty{
  margin-top:70px;text-align:center;padding:56px 24px;
  border:1px dashed var(--line);border-radius:20px;

  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#06121c;font-weight:600;transition:.2s;

.empty button:hover{filter:brightness(1.1);transform:translateY(-1px)}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.overlay{

/* ============ 响应式 ============ */
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.6)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .topbar{padding:12px 16px;gap:10px}
  .content{padding:26px 16px 70px}
  .top-links .top-link.internal{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr}
  .search kbd{display:none}
}
</style>
</head>

/* ==========================================================
   工具
   ========================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));
const hostOf = url => {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch(e){ return url; }
};
const hueOf = s => {
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
};

/* 预处理：补全域名与首字母 */
const LINKS = RAW_LINKS.map(l => {
  const domain = hostOf(l.url);
  const first = (domain[0] || '').toUpperCase();
  return { ...l, domain, letter: /[A-Z]/.test(first) ? first : '#' };
});

const state = { cat: 'all', letter: 'all', q: '' };

/* ==========================================================
   侧边栏渲染
   ========================================================== */
function renderCategories(){
  const counts = {};
  LINKS.forEach(l => { counts[l.cat] = (counts[l.cat] || 0) + 1; });

  const rows = [`<button class="cat-btn ${state.cat === 'all' ? 'active' : ''}" data-cat="all">
      <span>全部站点</span><span class="cat-count">${LINKS.length}</span>
    </button>`];

  CATEGORIES.forEach(cat => {
    if (!counts[cat]) return;
    rows.push(`<button class="cat-btn ${state.cat === cat ? 'active' : ''}" data-cat="${esc(cat)}">
      <span>${esc(cat)}</span><span class="cat-count">${counts[cat]}</span>
    </button>`);
  });

  $('catList').innerHTML = rows.join('');
}

function renderLetters(){
  const available = new Set(LINKS.map(l => l.letter));
  const letters = [];
  for (let i = 65; i <= 90; i++) letters.push(String.fromCharCode(i));
  if (available.has('#')) letters.push('#');

  $('letterList').innerHTML = letters.map(ch => {
    const has = available.has(ch);
    return `<button class="letter-btn ${state.letter === ch ? 'active' : ''}" data-letter="${ch}" ${has ? '' : 'disabled'}>${ch}</button>`;
  }).join('');
}

/* ==========================================================
   主内容渲染
   ========================================================== */
function matches(l){
  if (state.cat !== 'all' && l.cat !== state.cat) return false;
  if (state.letter !== 'all' && l.letter !== state.letter) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = `${l.name} ${l.desc} ${l.domain} ${l.cat}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHTML(l, i){
  const hue = hueOf(l.name);
  const mono = (l.name[0] || '?').toUpperCase();
  return `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"
      style="--h:${hue};animation-delay:${Math.min(i, 18) * 22}ms" title="${esc(l.name)} · ${esc(l.domain)}">
      <span class="icon">
        <span class="mono">${esc(mono)}</span>
        <img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(l.domain)}" alt="" loading="lazy" onerror="this.remove()">
      </span>
      <span class="card-body">
        <span class="card-name">${esc(l.name)}</span>
        <span class="card-desc">${esc(l.desc)}</span>
        <span class="card-domain">${esc(l.domain)}</span>
      </span>
      <svg class="card-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>`;
}

function renderResults(){
  const box = $('results');
  const sections = [];
  let total = 0;

  CATEGORIES.forEach(cat => {
    if (state.cat !== 'all' && state.cat !== cat) return;
    const items = LINKS.filter(l => l.cat === cat && matches(l));
    if (!items.length) return;
    total += items.length;
    sections.push(`<section class="group">
        <div class="group-head">
          <h2>${esc(cat)}</h2>
          <span class="group-count">${items.length}</span>
          <i></i>
        </div>
        <div class="grid">${items.map(cardHTML).join('')}</div>
      </section>`);
  });

  if (!total){
    box.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
        <h3>没有找到匹配的站点</h3>
        <p>换个关键词，或者清除筛选条件再试试。</p>
        <button id="resetBtn">清除筛选</button>
      </div>`;
    const rb = $('resetBtn');
    if (rb) rb.addEventListener('click', resetFilters);
    return;
  }

  box.innerHTML = sections.join('');
}

function renderAll(){
  renderCategories();
  renderLetters();
  renderResults();
  $('totalCount').textContent = LINKS.length;
  $('heroCount').textContent = LINKS.length;
  $('heroCat').textContent = CATEGORIES.filter(c => LINKS.some(l => l.cat === c)).length;
}

function resetFilters(){
  state.cat = 'all';
  state.letter = 'all';
  state.q = '';
  $('q').value = '';
  renderAll();
}

/* ==========================================================
   交互
   ========================================================== */
$('catList').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  state.cat = btn.dataset.cat;
  renderAll();
  closeSidebar();
});

$('letterList').addEventListener('click', e => {
  const btn = e.target.closest('.letter-btn');
  if (!btn || btn.disabled) return;
  state.letter = state.letter === btn.dataset.letter ? 'all' : btn.dataset.letter;
  renderAll();
  closeSidebar();
});

let searchTimer;
$('q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = e.target.value.trim();
    renderResults();
  }, 120);
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  if (e.key === '/' && !typing){
    e.preventDefault();
    $('q').focus();
  }
  if (e.key === 'Escape'){
    if (state.q || state.cat !== 'all' || state.letter !== 'all'){
      resetFilters();
    } else {
      $('q').blur();
    }
  }
});

/* 移动端侧边栏 */
const sidebar = $('sidebar');
const overlay = $('overlay');
function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
$('menuBtn').addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

/* 时钟 */
function tickClock(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tickClock, 1000);
tickClock();

renderAll();
</script>
